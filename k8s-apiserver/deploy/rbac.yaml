apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-apiserver
  namespace: harbor-apiserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-apiserver:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: harbor-apiserver
    namespace: harbor-apiserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-apiserver:extension-apiserver-authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: harbor-apiserver
    namespace: harbor-apiserver
---
# Grants read access to everyone bound to the built-in view, edit, or admin roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor.goharbor.io:view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [harbor.goharbor.io]
    resources: [harborrepositories, harborartifacts]
    verbs: [get, list, watch]
