apiVersion: v1
kind: Service
metadata:
  name: harbor-apiserver
  namespace: harbor-apiserver
spec:
  selector:
    app: harbor-apiserver
  # Each replica numbers its own resourceVersions, so a watch should reach the replica that served the list before it.
  sessionAffinity: ClientIP
  ports:
    - name: https
      port: 443
      targetPort: https
