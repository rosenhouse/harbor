# Serves the writable HarborReplication kind.
# Secret harbor-apiserver-replication holds a system-level Harbor robot account.
# With its credentials, anyone can replace any tag in the project with anything an endpoint's credentials can read, and stop or delete any policy that pulls into the project.
# With upstream Harbor, they can also replicate any project to any registry endpoint, and stop or delete any replication policy.
# While Harbor is unavailable, or rejects the robot, such as after it expires, no labeled namespace can finish deleting.
# Read docs/threat-model.md#the-replication-robot-controls-pulls-into-the-project first.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - rbac.yaml
patches:
  - path: deployment.yaml
    target:
      kind: Deployment
      name: harbor-apiserver
