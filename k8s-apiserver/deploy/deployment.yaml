apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-apiserver
  namespace: harbor-apiserver
spec:
  # An unavailable APIService breaks discovery and namespace deletion cluster-wide.
  replicas: 2
  selector:
    matchLabels:
      app: harbor-apiserver
  template:
    metadata:
      labels:
        app: harbor-apiserver
    spec:
      serviceAccountName: harbor-apiserver
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: harbor-apiserver
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harbor-apiserver
          image: harbor-apiserver:dev
          ports:
            - name: https
              containerPort: 6443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
