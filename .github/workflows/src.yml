name: src

on:
  push:
    branches: [agg]
    paths: [src/**, api/**, tools/swagger/**, .github/workflows/src.yml]
  pull_request:
    paths: [src/**, api/**, tools/swagger/**, .github/workflows/src.yml]

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  # This job tests the src packages that this fork changes. They need no database.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: go install github.com/go-swagger/go-swagger/cmd/swagger@v0.33.1
      - run: >-
          swagger generate server -q -f ../api/v2.0/swagger.yaml -A harbor --target server/v2.0
          --template-dir=../tools/swagger/templates --exclude-main
          --additional-initialism=CVE --additional-initialism=GC --additional-initialism=OIDC
      - run: go test ./common/rbac/... ./controller/replication/... ./server/v2.0/handler/...

  # This job tests the portal specs that this fork changes.
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng lint
      - run: >-
          npx ng test --watch=false --no-progress --browsers=ChromeHeadlessNoSandbox
          --include='src/app/shared/components/robot-permissions-panel/**/*.spec.ts'
          --include='src/app/base/left-side-nav/system-robot-accounts/**/*.spec.ts'
          --include='src/app/base/project/robot-account/**/*.spec.ts'
