name: k8s-apiserver

on:
  push:
    branches: [agg]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: k8s-apiserver

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: k8s-apiserver/go.mod
          cache-dependency-path: k8s-apiserver/go.sum
      - run: go test -race ./...
      - run: hack/verify-codegen.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: k8s-apiserver

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_KUBECONFIG: /tmp/harbor-apiserver-e2e.kubeconfig
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: k8s-apiserver/go.mod
          cache-dependency-path: k8s-apiserver/go.sum
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          sudo install "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          curl -fsSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz | tar -xzC "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      # A step timeout fails the step, so the diagnostics still run. A job timeout would cancel them.
      - run: hack/e2e.sh
        timeout-minutes: 25
      - if: failure()
        env:
          KUBECONFIG: ${{ env.E2E_KUBECONFIG }}
        run: |
          set +e
          kubectl get apiservice v1alpha1.harbor.goharbor.io -o yaml
          kubectl -n harbor-apiserver describe pods
          kubectl -n harbor-apiserver logs -l app=harbor-apiserver --prefix --tail=200
          kubectl -n harbor-apiserver logs -l app=harbor-apiserver --prefix --tail=200 --previous
          kubectl -n harbor get pods
          kubectl -n harbor describe pods
          kubectl -n harbor get events --sort-by=.lastTimestamp
          kubectl -n harbor logs -l 'app=harbor,component in (core,registry,nginx)' --all-containers --prefix --tail=200 --ignore-errors
          kubectl -n harbor logs -l 'app=harbor,component in (core,registry,nginx)' --all-containers --prefix --tail=200 --ignore-errors --previous
