name: k8s-apiserver

on:
  push:
    branches: [agg]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: k8s-apiserver

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: k8s-apiserver/go.mod
          cache-dependency-path: k8s-apiserver/go.sum
      - run: go test -race ./...
      - run: hack/verify-codegen.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: k8s-apiserver

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: k8s-apiserver/go.mod
          cache-dependency-path: k8s-apiserver/go.sum
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: hack/e2e.sh
      - if: failure()
        run: |
          kubectl get apiservice v1alpha1.harbor.goharbor.io -o yaml
          kubectl -n harbor-apiserver describe pods
          kubectl -n harbor-apiserver logs deployment/harbor-apiserver --tail=200
